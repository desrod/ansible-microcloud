---
- name: Converge a new MicroCloud cluster with any number of nodes
  hosts: microcloud
  become: true
  gather_facts: true
  strategy: linear

  vars:
    preseed_local: preseed.yaml
    preseed_remote: /var/tmp/preseed.yaml

    snaps:
      - microcloud
      - microceph
      - microovn
      - lxd

    # Set up the channel for the group of snaps, per the docs
    # https://documentation.ubuntu.com/microcloud/stable/microcloud/how-to/install/#installation
    snap_channel: stable
    snap_cohort: "+"

  tasks:

  #####################################################################
  # Optional: Clean out the cluster nodes for idempotent runs 
  #####################################################################
  - name: Stop snaps if running
    command: snap stop {{ item }}
    loop: "{{ snaps }}"
    ignore_errors: true
    changed_when: false

  - name: Remove snaps
    command: snap remove {{ item }} --purge
    loop: "{{ snaps }}"
    ignore_errors: true
    changed_when: false

  - name: Remove leftover snap state
    file:
      path: "/var/snap/{{ item }}"
      state: absent
    loop: "{{ snaps }}"

  #####################################################################
  # Install the required snaps: microcloud, microceph, microovn, lxd
  #####################################################################
  - name: Install snaps with cohort
    command: >
      snap install {{ item }}
      --channel={{ snap_channel }}
      --cohort={{ snap_cohort }}
    args:
      creates: "/snap/{{ item }}/current"
    loop: "{{ snaps }}"

  #####################################################################
  # Wait for MicroCloud daemon to become active and ready
  #####################################################################
  - name: Wait for microcloud daemon to reach a ready state
    command: snap services microcloud
    register: daemon_services
    retries: 30
    delay: 30
    until: "'microcloud.daemon' in daemon_services.stdout and 'active' in daemon_services.stdout"
    changed_when: false

  #####################################################################
  # Start bootstrap session on initiator
  #####################################################################
  - name: Start MicroCloud bootstrap session
    shell: microcloud preseed
    args:
      stdin: "{{ lookup('file', preseed_local) }}"
    async: 1800
    poll: 0
    register: bootstrap_job
    when: inventory_hostname == groups['microcloud'][0]

  #####################################################################
  # Wait for session creation
  #####################################################################
  - name: Wait for MicroCloud API
    wait_for:
      host: "{{ hostvars[groups['microcloud'][0]].ansible_host }}"
      port: 9443
      timeout: 60
    delegate_to: localhost
    become: false
    run_once: true

  #####################################################################
  # Join remaining nodes
  #####################################################################
  - name: Give bootstrap session time to initialize
    pause:
      seconds: 10
    run_once: true

  - name: Join MicroCloud cluster
    shell: microcloud preseed
    args:
      stdin: "{{ lookup('file', preseed_local) }}"
    when: inventory_hostname != groups['microcloud'][0]
    register: bootstrap_join
    retries: 30
    delay: 30
    until: bootstrap_join.rc == 0

  #####################################################################
  # Wait for the initiator to settle
  #####################################################################
  - name: Wait for bootstrap to finish on initiator
    async_status:
      jid: "{{ bootstrap_job.ansible_job_id }}"
    register: bootstrap_result
    until: bootstrap_result.finished
    retries: 30
    delay: 30
    when: inventory_hostname == groups['microcloud'][0]

  #####################################################################
  # Show cluster status
  #####################################################################
  - name: Show cluster status
    command: microcloud status
    run_once: true
    delegate_to: "{{ groups['microcloud'][0] }}"

